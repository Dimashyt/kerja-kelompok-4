<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    />
    <link rel="stylesheet" href="daftar.css" />
    <title>Hoyofest - Sign Up</title>
  </head>
  <body>
    <section class="login">
      <div class="Login_content">
        <div>
          <h2 class="login__title">Sign up</h2>
          <form action="" method="post" class="Login__form">
            <div class="Login__grup">
              <div class="Login__box">
                <i class="ri-user-3-fill Login__icon"></i>
                <input
                  type="text"
                  name="username"
                  autocomplete="username"
                  required
                  placeholder=" "
                  class="Login__input"
                  id="username"
                />
                <label for="username" class="Login__label">Username</label>
              </div>

              <div class="Login__box">
                <i class="ri-mail-fill Login__icon"></i>
                <input
                  type="email"
                  name="email"
                  autocomplete="email"
                  required
                  placeholder=" "
                  class="Login__input"
                  id="email"
                />
                <label for="email" class="Login__label">Email</label>
              </div>

              <div class="Login__box">
                <i class="ri-lock-2-fill Login__icon"></i>
                <input
                  type="password"
                  name="password"
                  autocomplete="new-password"
                  required
                  placeholder=" "
                  class="Login__input"
                  id="password"
                />
                <label for="password" class="Login__label">Password</label>
              </div>

              <div class="Login__box">
                <i class="ri-lock-password-fill Login__icon"></i>
                <input
                  type="password"
                  name="confirm_password"
                  autocomplete="new-password"
                  required
                  placeholder=" "
                  class="Login__input"
                  id="confirm_password"
                />
                <label for="confirm_password" class="Login__label">Confirm Password</label>
              </div>
            </div>

            <button type="submit" class="Login__button">
              Sign up
              <i class="ri-user-add-fill"></i>
            </button>

            <p class="Login__sign">
              Already have an account? <a href="login.html">Sign in</a>
            </p>
          </form>
        </div>
        <div class="Login__image">
          <img src="assets/sparxie.png" alt="Sparxie Character" class="Login__img" />
        </div>
      </div>
    </section>
  </body>
</html>
