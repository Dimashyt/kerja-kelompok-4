<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Struk Belanja - Hoyofest</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    />
    <link rel="stylesheet" href="struk.css" />
  </head>
  <body>
    <section class="container">
      <div class="struk">
        <div class="box_1">
          <div class="text">
            <h2>Terima kasih sudah berbelanja, <span id="displayNama">Pengunjung</span>!</h2>
            <h4>Pembayaran berhasil diverifikasi. E-tiket telah dikirim ke <span id="displayEmail">email kamu</span></h4>
            <div class="order-badge">
              <span id="displayOrderId">HOYO00001X</span> &bull; 
              <span id="displayTipe">Tiket Event Normal</span> &bull; 
              <span id="displayTotal">Rp 67.000</span> &bull;
              <strong style="color: #27ae60;">LUNAS</strong>
            </div>
          </div>
        </div>

        <div class="box_2">
          <div class="scan">
            <h3 class="scan_title">Scan QR E-Tiket Kamu</h3>
            <div id="contoh">
              <img
                id="qrImg"
                src=""
                alt="QR E-Tiket"
                class="qr_img"
              />
            </div>
            <a href="index.html" class="btn-bayar" style="text-decoration: none; text-align: center;">
              <i class="ri-home-4-fill"></i> Kembali ke Beranda
            </a>
          </div>
          <div class="gambar">
            <img
              src="assets/evanescia tuting.png"
              alt="Mascot Hoyofest"
              class="evanescia"
            />
          </div>
        </div>
      </div>
    </section>

    <script src="struk.js"></script>
  </body>
</html>
