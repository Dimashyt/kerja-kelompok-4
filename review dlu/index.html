<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Struk belanja</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    />
    <link rel="stylesheet" href="style banget.css" />
  </head>
  <body>
    <section class="container">
      <div class="struk">
        <div class="box_1">
          <div class="text">
            <h2>Terima kasih sudah berbelanja</h2>
            <h4>Jika ada kendala bisa hubungi kami saja</h4>
          </div>
        </div>

        <div class="box_2">
          <div class="scan">
            <h3 class="scan_title">Scan code disini</h3>
            <div id="contoh">
              <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=0&data=HOYOFEST-PAYMENT-QRIS-SUCCESS"
                alt="QR Code Pembayaran"
                class="qr_img"
              />
            </div>
            <button class="btn-bayar" onclick="konfirmasiBayar()">Saya sudah bayar</button>
          </div>
          <div class="gambar">
            <img
              src="assets/nihilux.png"
              alt="Mascot Hoyofest"
              class="evanescia"
            />
          </div>
        </div>
      </div>
    </section>

    <script>
      function konfirmasiBayar() {
        alert('Terima kasih! Pembayaran kamu berhasil diverifikasi.');
        window.location.href = '../index.html';
      }
    </script>
  </body>
</html>
